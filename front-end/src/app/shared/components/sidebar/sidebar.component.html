<aside class="admin-sidebar">
  <div class="sidebar-brand">
    <span>SIGEA</span>
  </div>

  <hr class="sidebar-divider">

  <nav class="sidebar-nav">
    <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
      <i class="bi bi-speedometer2"></i>
      <span>Painel de Controlo</span>
    </a>
    <a routerLink="/admin/courses" routerLinkActive="active" class="nav-item">
      <i class="bi bi-book"></i>
      <span>Cursos</span>
    </a>
    <a routerLink="/admin/classes" routerLinkActive="active" class="nav-item">
      <i class="bi bi-people"></i>
      <span>Turmas</span>
    </a>
    <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
      <i class="bi bi-person-badge"></i>
      <span>Formadores</span>
    </a>
    <a routerLink="/admin/enrollments" routerLinkActive="active" class="nav-item">
      <i class="bi bi-list-check"></i>
      <span>Inscrições</span>
    </a>
    <a routerLink="/admin/payments" routerLinkActive="active" class="nav-item">
      <i class="bi bi-credit-card"></i>
      <span>Pagamentos</span>
    </a>
    <a routerLink="/admin/certificates" routerLinkActive="active" class="nav-item">
      <i class="bi bi-patch-check"></i>
      <span>Certificados</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="nav-item logout" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Sair</span>
    </button>
  </div>
</aside>
