<!-- src/app/layouts/dashboard-layout/dashboard-layout.component.html -->
<div class="admin-layout">
  <app-sidebar></app-sidebar>

  <div class="admin-content">
    <!-- Topbar -->
    <header class="admin-topbar">
      <div class="topbar-right">
        <div class="user-menu" (click)="toggleMenu()" #menuRef>
          <i class="bi bi-person-circle"></i>
          <span>{{ user?.name }}</span>
          <i class="bi bi-chevron-down" [class.rotated]="open"></i>

          <div class="dropdown" *ngIf="open">
            <a (click)="open=false"><i class="bi bi-person"></i> Perfil</a>
            <hr>
            <a (click)="logout()" class="logout">
              <i class="bi bi-box-arrow-right"></i> Sair
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Conteúdo das páginas -->
    <main class="admin-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
